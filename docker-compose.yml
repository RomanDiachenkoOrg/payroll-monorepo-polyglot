name: payroll-polyglot

x-db-env: &db-env
  DATABASE_URL: postgresql+psycopg://payroll:payroll@db:5432/payroll

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
      POSTGRES_DB: payroll
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll -d payroll"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./services/api
    environment:
      <<: *db-env
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  reports:
    build: ./services/reports
    environment:
      DATABASE_URL: postgres://payroll:payroll@db:5432/payroll
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${REPORTS_PORT:-8081}:8081"

  notifier:
    build: ./services/notifier
    environment:
      DATABASE_URL: postgres://payroll:payroll@db:5432/payroll
      REDIS_URL: redis://redis:6379/0
      PORTAL_URL: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./web
    depends_on:
      - api
      - reports
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
